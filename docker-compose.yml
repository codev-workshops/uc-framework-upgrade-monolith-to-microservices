version: '3.8'

services:
  user-service:
    build:
      context: .
      dockerfile: services/user-service/Dockerfile
    ports:
      - "8081:8081"
    environment:
      - SERVER_PORT=8081
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8081/internal/users/user-1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  article-service:
    build:
      context: .
      dockerfile: services/article-service/Dockerfile
    ports:
      - "8082:8082"
    environment:
      - SERVER_PORT=8082
      - SERVICES_USER-SERVICE_URL=http://user-service:8081
      - SERVICES_FAVORITE-SERVICE_URL=http://favorite-service:8084
    depends_on:
      user-service:
        condition: service_healthy

  comment-service:
    build:
      context: .
      dockerfile: services/comment-service/Dockerfile
    ports:
      - "8083:8083"
    environment:
      - SERVER_PORT=8083
      - SERVICES_USER-SERVICE_URL=http://user-service:8081
      - SERVICES_ARTICLE-SERVICE_URL=http://article-service:8082
    depends_on:
      user-service:
        condition: service_healthy

  favorite-service:
    build:
      context: .
      dockerfile: services/favorite-service/Dockerfile
    ports:
      - "8084:8084"
    environment:
      - SERVER_PORT=8084
      - SERVICES_USER-SERVICE_URL=http://user-service:8081
      - SERVICES_ARTICLE-SERVICE_URL=http://article-service:8082
    depends_on:
      user-service:
        condition: service_healthy

  api-gateway:
    build:
      context: .
      dockerfile: services/api-gateway/Dockerfile
    ports:
      - "8080:8080"
    environment:
      - SERVER_PORT=8080
      - SERVICES_USER-SERVICE_URL=http://user-service:8081
      - SERVICES_ARTICLE-SERVICE_URL=http://article-service:8082
      - SERVICES_COMMENT-SERVICE_URL=http://comment-service:8083
      - SERVICES_FAVORITE-SERVICE_URL=http://favorite-service:8084
    depends_on:
      - user-service
      - article-service
      - comment-service
      - favorite-service
