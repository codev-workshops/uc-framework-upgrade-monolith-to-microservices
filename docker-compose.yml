version: '3.8'

services:
  user-service:
    build:
      context: .
      dockerfile: user-service/Dockerfile
    ports:
      - "8081:8081"
    environment:
      - SPRING_PROFILES_ACTIVE=docker
      - SERVER_PORT=8081
    networks:
      - realworld-net
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8081/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 5

  article-service:
    build:
      context: .
      dockerfile: article-service/Dockerfile
    ports:
      - "8082:8082"
    environment:
      - SPRING_PROFILES_ACTIVE=docker
      - SERVER_PORT=8082
      - SERVICES_USER_SERVICE_URL=http://user-service:8081
      - SERVICES_FAVORITE_SERVICE_URL=http://favorite-service:8084
    depends_on:
      user-service:
        condition: service_healthy
    networks:
      - realworld-net
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8082/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 5

  comment-service:
    build:
      context: .
      dockerfile: comment-service/Dockerfile
    ports:
      - "8083:8083"
    environment:
      - SPRING_PROFILES_ACTIVE=docker
      - SERVER_PORT=8083
      - SERVICES_ARTICLE_SERVICE_URL=http://article-service:8082
      - SERVICES_USER_SERVICE_URL=http://user-service:8081
    depends_on:
      article-service:
        condition: service_healthy
      user-service:
        condition: service_healthy
    networks:
      - realworld-net
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8083/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 5

  favorite-service:
    build:
      context: .
      dockerfile: favorite-service/Dockerfile
    ports:
      - "8084:8084"
    environment:
      - SPRING_PROFILES_ACTIVE=docker
      - SERVER_PORT=8084
      - SERVICES_ARTICLE_SERVICE_URL=http://article-service:8082
    depends_on:
      article-service:
        condition: service_healthy
    networks:
      - realworld-net
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8084/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 5

  api-gateway:
    build:
      context: .
      dockerfile: api-gateway/Dockerfile
    ports:
      - "8080:8080"
    environment:
      - SPRING_CLOUD_GATEWAY_ROUTES_0_URI=http://comment-service:8083
      - SPRING_CLOUD_GATEWAY_ROUTES_1_URI=http://favorite-service:8084
      - SPRING_CLOUD_GATEWAY_ROUTES_2_URI=http://user-service:8081
      - SPRING_CLOUD_GATEWAY_ROUTES_3_URI=http://user-service:8081
      - SPRING_CLOUD_GATEWAY_ROUTES_4_URI=http://user-service:8081
      - SPRING_CLOUD_GATEWAY_ROUTES_5_URI=http://article-service:8082
      - SPRING_CLOUD_GATEWAY_ROUTES_6_URI=http://article-service:8082
    depends_on:
      user-service:
        condition: service_healthy
      article-service:
        condition: service_healthy
      comment-service:
        condition: service_healthy
      favorite-service:
        condition: service_healthy
    networks:
      - realworld-net

networks:
  realworld-net:
    driver: bridge
