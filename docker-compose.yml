version: '3.8'

services:
  api-gateway:
    build:
      context: .
      dockerfile: api-gateway/Dockerfile
    ports:
      - "8080:8080"
    depends_on:
      user-service:
        condition: service_healthy
      article-service:
        condition: service_healthy
      comment-service:
        condition: service_healthy
      favorite-service:
        condition: service_healthy
      tag-service:
        condition: service_healthy
    networks:
      - realworld-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  user-service:
    build:
      context: .
      dockerfile: user-service/Dockerfile
    ports:
      - "8081:8081"
    environment:
      - SERVER_PORT=8081
      - JWT_SECRET=nRvyYC4soFxBdZ-F-5Nnzz5USXstR1YylsTd-mA0aKtI9HUlriGrtkf-TiuDapkLiUCogO3JOK7kwZisrHp6wA
      - JWT_SESSIONTIME=86400
    networks:
      - realworld-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8081/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  article-service:
    build:
      context: .
      dockerfile: article-service/Dockerfile
    ports:
      - "8082:8082"
    environment:
      - SERVER_PORT=8082
      - JWT_SECRET=nRvyYC4soFxBdZ-F-5Nnzz5USXstR1YylsTd-mA0aKtI9HUlriGrtkf-TiuDapkLiUCogO3JOK7kwZisrHp6wA
      - JWT_SESSIONTIME=86400
      - SERVICES_USER_SERVICE_URL=http://user-service:8081
      - SERVICES_FAVORITE_SERVICE_URL=http://favorite-service:8084
    depends_on:
      user-service:
        condition: service_healthy
      favorite-service:
        condition: service_healthy
    networks:
      - realworld-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8082/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  comment-service:
    build:
      context: .
      dockerfile: comment-service/Dockerfile
    ports:
      - "8083:8083"
    environment:
      - SERVER_PORT=8083
      - JWT_SECRET=nRvyYC4soFxBdZ-F-5Nnzz5USXstR1YylsTd-mA0aKtI9HUlriGrtkf-TiuDapkLiUCogO3JOK7kwZisrHp6wA
      - JWT_SESSIONTIME=86400
      - SERVICES_USER_SERVICE_URL=http://user-service:8081
      - SERVICES_ARTICLE_SERVICE_URL=http://article-service:8082
    depends_on:
      user-service:
        condition: service_healthy
      article-service:
        condition: service_healthy
    networks:
      - realworld-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8083/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  favorite-service:
    build:
      context: .
      dockerfile: favorite-service/Dockerfile
    ports:
      - "8084:8084"
    environment:
      - SERVER_PORT=8084
      - JWT_SECRET=nRvyYC4soFxBdZ-F-5Nnzz5USXstR1YylsTd-mA0aKtI9HUlriGrtkf-TiuDapkLiUCogO3JOK7kwZisrHp6wA
      - JWT_SESSIONTIME=86400
      - SERVICES_ARTICLE_SERVICE_URL=http://article-service:8082
    networks:
      - realworld-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8084/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  tag-service:
    build:
      context: .
      dockerfile: tag-service/Dockerfile
    ports:
      - "8085:8085"
    environment:
      - SERVER_PORT=8085
    networks:
      - realworld-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8085/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

networks:
  realworld-network:
    driver: bridge
