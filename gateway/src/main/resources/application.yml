server:
  port: 8080

services:
  user: http://localhost:8081
  tag: http://localhost:8083
  profile: http://localhost:8085
  article: http://localhost:8087
  monolith: http://localhost:8082

spring:
  application:
    name: gateway
  cloud:
    gateway:
      routes:
        - id: user-service
          uri: ${services.user}
          predicates:
            - Path=/users,/users/**,/user,/user/**
        - id: tag-service
          uri: ${services.tag}
          predicates:
            - Path=/tags,/tags/**
        - id: profile-service
          uri: ${services.profile}
          predicates:
            - Path=/profiles/**
        - id: article-service
          uri: ${services.article}
          predicates:
            - Path=/articles,/articles/**
        - id: monolith
          uri: ${services.monolith}
          predicates:
            - Path=/graphql,/graphiql,/subscriptions/**
      globalcors:
        cors-configurations:
          '[/**]':
            allowedOrigins: "*"
            allowedMethods:
              - HEAD
              - GET
              - POST
              - PUT
              - DELETE
              - PATCH
              - OPTIONS
            allowedHeaders:
              - Authorization
              - Cache-Control
              - Content-Type

logging:
  level:
    org.springframework.cloud.gateway: INFO
