server:
  port: 8080

spring:
  cloud:
    gateway:
      routes:
        - id: comment-service
          uri: http://comment-service:8083
          predicates:
            - Path=/articles/*/comments,/articles/*/comments/**

        - id: user-service
          uri: http://user-service:8081
          predicates:
            - Path=/users,/users/**,/user,/user/**,/profiles,/profiles/**

        - id: article-service
          uri: http://article-service:8082
          predicates:
            - Path=/articles,/articles/**,/tags,/tags/**

      default-filters:
        - DedupeResponseHeader=Access-Control-Allow-Credentials Access-Control-Allow-Origin

      globalcors:
        corsConfigurations:
          '[/**]':
            allowedOrigins: "*"
            allowedMethods: "*"
            allowedHeaders: "*"
