version: '3.8'

services:
  api-gateway:
    build:
      context: .
      dockerfile: Dockerfile.api-gateway
    ports:
      - "8080:8080"
    depends_on:
      user-service:
        condition: service_healthy
      article-service:
        condition: service_healthy
      comment-service:
        condition: service_healthy
    environment:
      - SPRING_CLOUD_GATEWAY_ROUTES[0]_URI=http://user-service:8081
      - SPRING_CLOUD_GATEWAY_ROUTES[1]_URI=http://user-service:8081
      - SPRING_CLOUD_GATEWAY_ROUTES[2]_URI=http://user-service:8081
      - SPRING_CLOUD_GATEWAY_ROUTES[3]_URI=http://article-service:8082
      - SPRING_CLOUD_GATEWAY_ROUTES[4]_URI=http://article-service:8082
      - SPRING_CLOUD_GATEWAY_ROUTES[5]_URI=http://comment-service:8083

  user-service:
    build:
      context: .
      dockerfile: Dockerfile.user-service
    ports:
      - "8081:8081"
    volumes:
      - db-data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8081/internal/users/health"]
      interval: 10s
      timeout: 5s
      retries: 5

  article-service:
    build:
      context: .
      dockerfile: Dockerfile.article-service
    ports:
      - "8082:8082"
    volumes:
      - db-data:/data
    environment:
      - USER_SERVICE_URL=http://user-service:8081
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8082/internal/articles/health"]
      interval: 10s
      timeout: 5s
      retries: 5

  comment-service:
    build:
      context: .
      dockerfile: Dockerfile.comment-service
    ports:
      - "8083:8083"
    volumes:
      - db-data:/data
    environment:
      - USER_SERVICE_URL=http://user-service:8081
      - ARTICLE_SERVICE_URL=http://article-service:8082
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8083/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 5

  frontend:
    build:
      context: ./frontend
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_URL=http://api-gateway:8080/api
    depends_on:
      - api-gateway

volumes:
  db-data:
